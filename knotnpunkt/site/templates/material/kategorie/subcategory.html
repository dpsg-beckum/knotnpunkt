{%extends "material/kategorie/category.html"%}

{% block breadcrumbs%}
{{ super() }}
<a class="breadcrumb-item" href="{{url_for('site.material.kategorie.subcategory', id=subkategorie.id)}}">
    {{ subkategorie.name }}
</a>
{%endblock%}

{% block content%}

<div class="accordion mb-3" id="accordionExample">
    <div class="accordion-item">
        <h2 class="accordion-header">
            <button class="accordion-button collapsed fw-bold" type="button" data-bs-toggle="collapse"
                data-bs-target="#collapseOne" aria-expanded="false" aria-controls="collapseOne">
                Filter
            </button>
        </h2>
        <div id="collapseOne" class="accordion-collapse collapse" data-bs-parent="#accordionExample">

            <div class="m-3">
                <form method="get" action="#">
                    <div class="row g-3">
                        <div class="col-12 col-md-6">
                            <label class="form-label" for="search">Suchbegriff</label>
                            <input type="search" id="search" class="form-control"
                                placeholder="z. B. 2-Personen, 4-Jahreszeiten …">
                        </div>
                        <div class="col-12 col-md-6">
                            <label class="form-label" for="subfilter">Subkategorie</label>
                            <select id="subfilter" class="form-select">
                                <option value="">Alle</option>
                                <option>Leichtzelte</option>
                                <option>Familienzelte</option>
                                <option>Expeditionszelte</option>
                                <option>Tipis</option>
                            </select>
                        </div>
                        <div class="col-12 col-md-4">
                            <label class="form-label" for="kapazitaet">Kapazität</label>
                            <select id="kapazitaet" class="form-select">
                                <option value="">Alle</option>
                                <option>1-2 Personen</option>
                                <option>3-4 Personen</option>
                                <option>5+ Personen</option>
                            </select>
                        </div>
                        <div class="col-12 col-md-4">
                            <label class="form-label" for="saisons">Saison</label>
                            <select id="saisons" class="form-select">
                                <option value="">Alle</option>
                                <option>3-Jahreszeiten</option>
                                <option>4-Jahreszeiten</option>
                            </select>
                        </div>
                        <div class="col-12 col-md-4">
                            <label class="form-label" for="gewicht">Max. Gewicht (kg)</label>
                            <input type="number" step="0.1" min="0" id="gewicht" class="form-control"
                                placeholder="z. B. 2.5">
                        </div>
                    </div>
                    <div class="mt-3 d-flex gap-2">
                        <button type="submit" class="btn btn-primary">Anwenden</button>
                        <button type="reset" class="btn btn-outline-secondary">Zurücksetzen</button>
                    </div>
                </form>
            </div>

        </div>
    </div>
</div>

<div class="col-12">
    {{ materiallist(subkategorie.kategorie_typen.name + " " + subkategorie.name, material) }}
</div>


{% endblock %}
