{%extends "material/sets/base.html"%}

{% block tab%}
<h1>
    Neues Set erstellen
</h1>
<form method="post">
    {{ form.hidden_tag() }}
    <div class="input-group mb-3">
        <span class="input-group-text">Nr.</span>
        {{ form.number(class="form-control") }}
        <span class="input-group-text">.</span>
        {{ form.set_type(class="form-select") }}
        {{ form.submit(class="btn btn-success") }}
    </div>
</form>

{% endblock %}
